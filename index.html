<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mi Rutina de Pesas</title>

  <!-- PWA & iOS Safari Config -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mi Rutina">
  <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/dumb-bell-emoji.png">

  <!-- Chart.js CDN para el gráfico de peso -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --accent-color: #38BDF8;
      --accent-hover: #0284C7;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --border-color: #334155;
      --success-color: #22C55E;
      --danger-color: #EF4444;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px 40px;
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* Modal de Onboarding / Perfil */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .modal-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #0F172A;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .form-group input:focus {
      border-color: var(--accent-color);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      color: #0F172A;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-primary:active {
      background: var(--accent-hover);
    }

    .btn-success {
      background: var(--success-color);
      color: #0F172A;
    }

    /* Header Principal */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .user-greeting {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .user-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-edit-profile {
      background: #334155;
      color: var(--text-main);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Tarjetas de Estadísticas */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
    }

    .stat-val {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .stat-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Barra de Progreso */
    .progress-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .progress-bar-bg {
      background: #0F172A;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--accent-color), var(--success-color));
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    /* Selector de Pestañas */
    .tab-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      padding: 10px 2px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #0F172A;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Tarjetas de Ejercicios */
    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .ex-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .ex-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-color);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .ex-details {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    /* Sets / Reps Checkbox (Botones para mejor respuesta en iOS) */
    .sets-row {
      display: flex;
      gap: 10px;
    }

    button.set-box {
      flex: 1;
      background: #0F172A;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-muted);
      user-select: none;
      outline: none;
    }

    button.set-box.completed {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--success-color);
      color: var(--success-color);
      font-weight: 700;
    }

    /* Secciones e Historial */
    .section-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .chart-container {
      position: relative;
      height: 200px;
      width: 100%;
      margin-top: 10px;
    }
